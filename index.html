<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8dbca2">
  <meta name="description" content="Zen Garden — a peaceful interactive browser experience.">
  <title>Zen Garden — A Little Place to Breathe</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="loading" class="loading-screen" aria-live="polite">
    <div class="loading-mark">🌿</div>
    <div class="loading-title">Zen Garden</div>
    <div class="loading-text">Take a little moment.</div>
  </div>

  <main id="app" class="app" hidden>
    <canvas id="ambientCanvas" aria-hidden="true"></canvas>

    <div class="scene" id="scene">
      <div class="sky">
        <div class="sun" id="sun"></div>
        <div class="moon" id="moon"></div>
        <div class="cloud cloud-a"></div>
        <div class="cloud cloud-b"></div>
        <div class="stars" id="stars"></div>
      </div>
      <div class="hill hill-back"></div>
      <div class="hill hill-mid"></div>
      <div class="meadow"></div>

      <div class="garden-world" id="gardenWorld">
        <div class="path path-main"></div>
        <div class="pond" id="pond" role="button" tabindex="0" aria-label="Garden pond. Tap or click to create ripples.">
          <div class="pond-shine"></div>
          <div class="lily lily-1"><span>🌱</span></div>
          <div class="lily lily-2"><span>🌱</span></div>
          <div class="pond-edge-rock rock pond-rock-a"></div>
          <div class="pond-edge-rock rock pond-rock-b"></div>
        </div>

        <div class="tree tree-left"><span class="trunk"></span><span class="canopy"></span></div>
        <div class="tree tree-right"><span class="trunk"></span><span class="canopy"></span></div>
        <div class="bush bush-a"></div>
        <div class="bush bush-b"></div>

        <div id="objects" class="objects"></div>
        <div id="butterflies" class="butterflies" aria-hidden="true"></div>
        <div id="fireflies" class="fireflies" aria-hidden="true"></div>
      </div>
    </div>

    <header class="top-ui">
      <div class="title-wrap">
        <h1>Zen Garden</h1>
        <p id="welcomeSub" class="subtitle">A little place to breathe.</p>
      </div>
    </header>

    <div class="message" id="message" role="status"></div>

    <nav class="toolbar" aria-label="Garden controls">
      <button class="tool-btn" id="toolsBtn" aria-expanded="false" aria-controls="toolsMenu">🌱 <span>Garden</span></button>
      <button class="tool-btn" id="timeBtn" type="button" aria-label="Change time of day">☀️</button>
      <button class="tool-btn" id="soundBtn" type="button" aria-pressed="false">🔈 <span>Sound</span></button>
      <button class="tool-btn" id="settingsBtn" type="button">⚙️</button>
      <button class="tool-btn" id="resetBtn" type="button">↻</button>

      <div class="tools-menu" id="toolsMenu" hidden>
        <button class="tool-choice active" data-tool="none">✋ Explore</button>
        <button class="tool-choice" data-tool="flower-white">🌼 White Flower</button>
        <button class="tool-choice" data-tool="flower-pink">🌸 Pink Flower</button>
        <button class="tool-choice" data-tool="flower-purple">🪻 Purple Flower</button>
        <button class="tool-choice" data-tool="flower-yellow">🌻 Yellow Flower</button>
        <button class="tool-choice" data-tool="stone">🪨 Stone</button>
        <button class="tool-choice" data-tool="plant">🌿 Plant</button>
        <button class="tool-choice" data-tool="leaf">🍃 Leaf</button>
      </div>
    </nav>

    <div class="tool-hint" id="toolHint" hidden></div>

    <section class="settings-panel" id="settingsPanel" aria-labelledby="settingsTitle" hidden>
      <div class="panel-card">
        <div class="panel-head">
          <div>
            <h2 id="settingsTitle">Settings</h2>
            <p>Keep the garden exactly as gentle as you like.</p>
          </div>
          <button class="close-btn" id="closeSettings" aria-label="Close settings">×</button>
        </div>

        <div class="settings-grid">
          <label class="setting">
            <span>Day / night speed</span>
            <select id="daySpeed">
              <option value="0.03">Slow</option>
              <option value="0.07" selected>Gentle</option>
              <option value="0.15">Faster</option>
            </select>
          </label>

          <label class="setting">
            <span>Weather</span>
            <select id="weather">
              <option value="clear" selected>Clear</option>
              <option value="rain">Light rain</option>
              <option value="breeze">Gentle breeze</option>
            </select>
          </label>

          <label class="setting">
            <span>Particle density</span>
            <input id="particleDensity" type="range" min="20" max="90" value="55">
          </label>

          <label class="setting">
            <span>Ambient volume</span>
            <input id="ambientVolume" type="range" min="0" max="100" value="35">
          </label>

          <label class="setting">
            <span>Effects volume</span>
            <input id="effectsVolume" type="range" min="0" max="100" value="45">
          </label>
        </div>

        <div class="setting-toggles">
          <label><input id="reducedMotion" type="checkbox"> Reduce motion</label>
          <label><input id="highContrast" type="checkbox"> High contrast UI</label>
        </div>

        <div class="panel-actions">
          <button id="clearSaved" class="secondary-action">Clear saved garden</button>
          <button id="closeSettings2" class="primary-action">Done</button>
        </div>
      </div>
    </section>

    <div id="resetDialog" class="dialog-layer" hidden>
      <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
        <div class="dialog-icon">🌱</div>
        <h2 id="resetTitle">Start with a fresh garden?</h2>
        <p>Your current garden arrangement will be cleared.</p>
        <div class="dialog-actions">
          <button class="secondary-action" id="cancelReset">Cancel</button>
          <button class="primary-action" id="confirmReset">Reset Garden</button>
        </div>
      </div>
    </div>

    <div class="accessibility-note" id="accessibilityNote" hidden>
      Motion is reduced. The garden remains fully interactive.
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
